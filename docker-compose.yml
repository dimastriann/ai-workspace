# =============================================================================
# AI Workspace — Docker Compose
# =============================================================================

services:
  # ── Frontend (Next.js 16) ───────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - SKILLS_DIR=/app/skills
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
      - ./skills:/app/skills:ro

  # ── Background Worker (Postgres job queue) ───────────────────────────────
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.tasks.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      - SKILLS_DIR=/app/skills
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
      - ./skills:/app/skills:ro

  # ── Rust Parser Service (optional accelerator) ───────────────────────────
  parser:
    build:
      context: ./rust/parser
      dockerfile: Dockerfile
    profiles: ["optional"]
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  # 17 is retained for data-volume compatibility; the 18 upgrade is documented.
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_workspace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (optional cache) ───────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    profiles: ["optional"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Qdrant (optional semantic retrieval) ─────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: ["optional"]
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  api_uploads:
